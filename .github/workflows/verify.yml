name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.8.1
      HELM_VERSION: v4.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install kustomize and Helm
        run: |
          mkdir -p .tools/bin
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C .tools/bin kustomize
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm .tools/bin/helm
          chmod +x .tools/bin/kustomize .tools/bin/helm
          .tools/bin/kustomize version
          .tools/bin/helm version

      - name: Run all verification scripts
        run: scripts/verify-all.sh

  # verify-all.sh calls harness/check_all.py directly, which leaves the action wrapper
  # around it untested -- and the wrapper is the only part an outside repo actually
  # touches. These two jobs run the action the same way a caller would.
  action-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: fixtures/all/good

  action-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          path: fixtures/all/bad
          # The fixture violates every item on purpose, so the run has to survive the
          # findings for this job to be able to assert on them.
          fail-on-findings: 'false'
      - name: The bad fixture must report findings
        run: |
          if [ "${{ steps.check.outputs.findings }}" != 'true' ]; then
            echo "expected findings=true, got '${{ steps.check.outputs.findings }}'"
            exit 1
          fi
