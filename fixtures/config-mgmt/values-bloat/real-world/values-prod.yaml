# Typical per-env override on top of the real ingress-nginx chart values.yaml --
# a team only ever touches a handful of the chart's ~345 parameterized fields.
controller:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
