# Rendered dev environment -- an overlay/values file actually patches host and
# API_URL per environment, so they properly vary instead of being hardcoded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.4.2
          env:
            - name: API_URL
              value: https://dev.payment-api.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api
  namespace: payment
spec:
  rules:
    - host: dev.payment-api.example.com
