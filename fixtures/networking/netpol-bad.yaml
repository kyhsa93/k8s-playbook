# Deployment + Service with no NetworkPolicy -- the namespace has no default-deny,
# so all pod-to-pod and ingress traffic is implicitly allowed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.4.2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: payment
spec:
  selector:
    app: payment-api
  ports:
    - port: 8080
