# Real external-secrets.io schema (external-secrets/external-secrets, Apache 2.0):
# ExternalSecret never carries secret material directly -- spec.data only holds
# *references* into an external store (secretStoreRef), and there's no top-level
# data/stringData field the way a real Secret has one, so check_plaintext's
# kind == "Secret" filter naturally leaves this alone without needing a
# kind-exclusion list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-api-secrets
  namespace: payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payment-api-vault
    kind: SecretStore
  target:
    name: payment-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: payment-api/db-password
    - secretKey: api-key
      remoteRef:
        key: payment-api/api-key
