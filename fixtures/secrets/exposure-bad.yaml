# Secret-like values exposed via ConfigMap and a plain env var instead of a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  namespace: payment
data:
  LOG_LEVEL: info
  DB_PASSWORD: hunter2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.4.2
          env:
            - name: API_KEY
              value: sk-live-abcd1234efgh5678
