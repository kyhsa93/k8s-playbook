# Only the encrypted SealedSecret form is committed; the real Secret it decrypts to
# is generated in-cluster by the sealed-secrets controller and never touches Git.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: payment-api-secrets
  namespace: payment
spec:
  encryptedData:
    db-password: AgBy8h3i2...encrypted-blob...
    api-key: AgCd4j9k1...encrypted-blob...
  template:
    metadata:
      name: payment-api-secrets
      namespace: payment
    type: Opaque
