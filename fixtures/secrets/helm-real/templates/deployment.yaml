apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: payment-api:1.4.2
          env:
            - name: API_KEY
              {{- if .Values.apiKey.useSecretRef }}
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: api-key
              {{- else }}
              value: {{ .Values.apiKey.plainValue }}
              {{- end }}
