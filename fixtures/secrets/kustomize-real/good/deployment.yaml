apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.4.2
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: api-key
