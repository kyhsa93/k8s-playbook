# Same config, but secret-like values are sourced from a Secret (secretKeyRef),
# ConfigMap only carries non-sensitive data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  namespace: payment
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.4.2
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: db-password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: api-key
