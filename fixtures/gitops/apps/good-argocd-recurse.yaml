# Real Argo CD "App of Apps" pattern: a root Application syncs a repo directory with
# `directory.recurse: true`, so every Application manifest under that path (the child
# apps below) gets applied as a managed resource of the root's sync. There is no
# ownerReference from child to root -- recurse is the actual mechanism, which is why
# deleting the root without a finalizer famously leaves the children orphaned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/example/gitops-apps
    path: apps/
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/example/payment-api
    path: deploy/
  destination:
    namespace: payment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-api
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/example/order-api
    path: deploy/
  destination:
    namespace: order
