# App-of-Apps: a root Application manages the child Applications as a group. Argo CD
# stamps ownerReferences on children it creates, so that reference is the checkable signal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/example/gitops-apps
    path: apps/
  destination:
    namespace: argocd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api
  namespace: argocd
  ownerReferences:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      name: root-app
spec:
  source:
    repoURL: https://github.com/example/payment-api
    path: deploy/
  destination:
    namespace: payment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-api
  namespace: argocd
  ownerReferences:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      name: root-app
spec:
  source:
    repoURL: https://github.com/example/order-api
    path: deploy/
  destination:
    namespace: order
