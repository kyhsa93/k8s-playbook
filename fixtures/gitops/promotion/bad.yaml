# Promotion pipeline (Kargo-style Stage resources) with no verification gate before prod:
# a dev change can reach prod with nothing checking it in between.
apiVersion: promotion.example/v1
kind: Stage
metadata:
  name: dev
spec:
  requestedFreight:
    - origin: payment-api
---
apiVersion: promotion.example/v1
kind: Stage
metadata:
  name: staging
spec:
  requestedFreight:
    - origin: payment-api
      sources:
        stages: [dev]
---
apiVersion: promotion.example/v1
kind: Stage
metadata:
  name: prod
spec:
  requestedFreight:
    - origin: payment-api
      sources:
        stages: [staging]
