# Git-declared desired state (what's committed to the GitOps repo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: payment-api
          image: registry.example.com/payment-api:1.4.2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  namespace: payment
data:
  LOG_LEVEL: info
