apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-b
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kyhsa93/k8s-playbook.git
    path: examples/argocd-live-validation/workloads/b
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-live-b
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
